<!-- Export Report Modal Component -->
<div class="modal fade" id="exportReportModal" tabindex="-1" aria-labelledby="exportReportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 15px;">
            <div class="modal-header" style="border-bottom: 1px solid rgba(0, 0, 0, 0.1);">
                <h5 class="modal-title" id="exportReportModalLabel">
                    <i class="bi bi-file-earmark-arrow-down me-2"></i>Export Report
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="exportReportForm" method="POST" action="{{ export_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    <!-- Period Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-calendar-range me-2"></i>Report Period
                        </label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="period_type" id="periodDefault" value="default" checked>
                            <label class="form-check-label" for="periodDefault">
                                Last 6 months (default)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="period_type" id="periodCustom" value="custom">
                            <label class="form-check-label" for="periodCustom">
                                Custom date range
                            </label>
                        </div>
                    </div>

                    <!-- Custom Date Range (Hidden by default) -->
                    <div id="customDateRange" style="display: none;">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" name="start_date">
                            </div>
                            <div class="col-md-6">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="endDate" name="end_date">
                            </div>
                        </div>
                    </div>

                    <!-- Format Selection -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-file-earmark-text me-2"></i>Export Format
                        </label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="format" id="formatPdf" value="pdf" checked>
                            <label class="form-check-label" for="formatPdf">
                                <i class="bi bi-file-pdf text-danger me-1"></i>PDF (with charts)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="formatCsv" value="csv">
                            <label class="form-check-label" for="formatCsv">
                                <i class="bi bi-file-earmark-spreadsheet text-success me-1"></i>CSV (Excel compatible)
                            </label>
                        </div>
                    </div>

                    <div class="alert alert-info mb-0" style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2);">
                        <small>
                            <i class="bi bi-info-circle me-1"></i>
                            Reports include all data within the selected period.
                        </small>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid rgba(0, 0, 0, 0.1);">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-download me-2"></i>Download Report
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Toggle custom date range visibility
    document.addEventListener('DOMContentLoaded', function() {
        const periodDefault = document.getElementById('periodDefault');
        const periodCustom = document.getElementById('periodCustom');
        const customDateRange = document.getElementById('customDateRange');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');

        function toggleCustomDateRange() {
            if (periodCustom.checked) {
                customDateRange.style.display = 'block';
                startDateInput.required = true;
                endDateInput.required = true;
            } else {
                customDateRange.style.display = 'none';
                startDateInput.required = false;
                endDateInput.required = false;
            }
        }

        periodDefault.addEventListener('change', toggleCustomDateRange);
        periodCustom.addEventListener('change', toggleCustomDateRange);

        // Set max date to today
        const today = new Date().toISOString().split('T')[0];
        endDateInput.max = today;
        startDateInput.max = today;

        // Validate date range
        document.getElementById('exportReportForm').addEventListener('submit', function(e) {
            if (periodCustom.checked) {
                const startDate = new Date(startDateInput.value);
                const endDate = new Date(endDateInput.value);
                
                if (startDate > endDate) {
                    e.preventDefault();
                    alert('Start date must be before end date');
                    return false;
                }
            }
        });
    });
</script>
